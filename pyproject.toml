[project]
name = "job-outreach"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "openpyxl>=3.1",
  "google-api-python-client>=2.0",
  "google-auth-oauthlib>=1.2",
  "google-auth-httplib2>=0.2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
